name: Deploy to Ministry Windows server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ministry-production
  cancel-in-progress: true

jobs:
  deploy:
    # A self-hosted runner must be installed on the Ministry server.
    runs-on: [self-hosted, windows]
    timeout-minutes: 20

    steps:
      - name: Check out release
        uses: actions/checkout@v4

      - name: Build frontend
        shell: powershell
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Prepare deployment directories
        shell: powershell
        run: |
          $account = '{0}\{1}' -f $env:COMPUTERNAME, $env:USERNAME
          $backend = 'C:\apps\moa-leadership-survey\backend'
          $iisRoot = 'C:\inetpub\wwwroot\moa-leadership-survey'
          if (-not (Test-Path -LiteralPath $backend)) { throw "Backend directory not found: $backend" }
          if (-not (Test-Path -LiteralPath $iisRoot)) { New-Item -ItemType Directory -Path $iisRoot -Force | Out-Null }
          icacls $backend /grant "${account}:(OI)(CI)M" /T /C
          icacls $iisRoot /grant "${account}:(OI)(CI)M" /T /C
          attrib -R "$backend\*" /S /D
          attrib -R "$iisRoot\*" /S /D

      - name: Publish backend release
        shell: powershell
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE 'backend'
          $destination = 'C:\apps\moa-leadership-survey\backend'
          Get-ChildItem -LiteralPath $source -Force |
            Where-Object { $_.Name -notin @('.env', 'node_modules') } |
            Copy-Item -Destination $destination -Recurse -Force
          Set-Location $destination
          npm ci --omit=dev

      - name: Publish frontend to IIS
        shell: powershell
        run: |
          $iisRoot = 'C:\inetpub\wwwroot\moa-leadership-survey'
          if (-not (Test-Path -LiteralPath $iisRoot)) {
            New-Item -ItemType Directory -Path $iisRoot -Force | Out-Null
          }
          Copy-Item -Path '.\frontend\build\*' -Destination $iisRoot -Recurse -Force

      - name: Restart API
        shell: powershell
        run: |
          Set-Location 'C:\apps\moa-leadership-survey\backend'
          $env:PM2_HOME = 'C:\Users\Administrator\.pm2'
          $pm2 = 'C:\Users\Administrator\AppData\Roaming\npm\pm2.cmd'
          if (-not (Test-Path -LiteralPath $pm2)) { throw "PM2 was not found at $pm2. Run 'where.exe pm2' on the server and update the workflow path." }
          & $pm2 restart moa-leadership-survey-backend --update-env
          if ($LASTEXITCODE -ne 0) {
            Write-Host 'Existing PM2 process was not restarted; starting it from server.js.'
            & $pm2 start '.\server.js' --name moa-leadership-survey-backend --update-env
          }
          if ($LASTEXITCODE -ne 0) { throw 'PM2 could not restart or start moa-leadership-survey-backend.' }
          & $pm2 save
          if ($LASTEXITCODE -ne 0) { throw 'PM2 could not save the process list.' }

      - name: Verify API health
        shell: powershell
        run: |
          $healthy = $false
          $lastError = ''
          for ($attempt = 1; $attempt -le 24; $attempt++) {
            try {
              $health = Invoke-RestMethod -Uri 'http://127.0.0.1:5001/api/health' -TimeoutSec 5
              if ($health.status -eq 'ok' -and $health.database -eq 'connected') {
                $healthy = $true
                Write-Host "API health check passed on attempt $attempt."
                break
              }
              $lastError = "Unexpected health response: $($health | ConvertTo-Json -Compress)"
            } catch {
              $lastError = $_.Exception.Message
            }
            Write-Host "Health check attempt $attempt failed; retrying in 5 seconds. $lastError"
            Start-Sleep -Seconds 5
          }
          if (-not $healthy) { throw "Health check failed after 24 attempts. Last error: $lastError" }
